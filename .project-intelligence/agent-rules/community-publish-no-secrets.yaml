id: community-publish-no-secrets
rule: >-
  Đây là dự án publish cộng đồng (zsh-plugin-ah / al0xd/ah). LUÔN tuân thủ bảo
  mật: không commit/push/log/in README bất kỳ token, secret key, password, API
  key, private key, .env, credentials; không hardcode secret; review diff trước
  commit/PR; redact dữ liệu nhạy cảm trong docs/demo/test. Nếu nghi lộ secret →
  không push, cảnh báo user ngay.
created_at: 2026-08-06T02:16:00.000Z
updated_at: 2026-08-06T02:16:00.000Z
source_prompt: >-
  ghi nhớ rule bảo mật: Đây là dự án publish cộng đồng, do đó luôn phải tuân thủ
  các yêu cầu bảo mật, tránh lộ token, secret key và các dữ liệu nhạy cảm
active: true
